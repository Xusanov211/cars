<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div id="cars"></div>

    <script>
        fetch('../backend/cars.json')
            .then(r => r.json())
            .then(cars => {
                document.getElementById('cars').innerHTML = cars.map(c => `
                    <div style="border: 1px solid black;">
                        <img src="${c.img || ''}" alt="${c.brand} ${c.model}" width="300">
                        <h1>${c.brand}</h1>
                        <h1>${c.model}</h1>
                        <p>$${c.price}</p>
                        <p>${c.year ?? ''}</p>
                    </div>`).join('');
            });
    </script>
</body>

</html>
